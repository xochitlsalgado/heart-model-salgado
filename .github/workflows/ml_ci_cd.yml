name: ML CI/CD Pipeline

on:
  repository_dispatch:
    types: [ml_ci_cd]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Dataset and Train Model
        run: |
          curl -L "${{ github.event.client_payload.dataseturl }}" -o dataset.csv
          python train.py --dataset dataset.csv

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/fastapiml:${{ github.event.client_payload.sha }} .
          docker tag ${{ secrets.DOCKER_USER }}/fastapiml:${{ github.event.client_payload.sha }} ${{ secrets.DOCKER_USER }}/fastapiml:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USER }}/fastapiml:${{ github.event.client_payload.sha }}
          docker push ${{ secrets.DOCKER_USER }}/fastapiml:latest

      # PASO NUEVO: Notificar a Render para que descargue la imagen 'latest'
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"